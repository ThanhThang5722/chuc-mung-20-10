<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Be+Vietnam+Pro:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #2D0818;
    }

    /* ── Nền sơn mài ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(150deg,
        #D4366E 0%, #B02858 38%, #882040 72%, #6A1535 100%);
    }

    /* ── Ánh sáng trung tâm (như nến) ── */
    .bloom {
      position: fixed;
      top: 50%; left: 50%;
      width: 75vmax; height: 75vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse,
        rgba(255, 130, 170, 0.32) 0%,
        rgba(220,  70, 120, 0.14) 45%,
        transparent 70%);
      z-index: 2;
      pointer-events: none;
      animation: bloomPulse 5.5s ease-in-out infinite;
    }

    @keyframes bloomPulse {
      0%, 100% { opacity: 0.6;  transform: translate(-50%, -50%) scale(1);    }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.13); }
    }

    /* ── Canvas ── */
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* ── Nội dung chính ── */
    .content {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(28px, 5vw, 56px) clamp(32px, 7vw, 76px);
      background: rgba(55, 8, 25, 0.52);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.32);
      box-shadow:
        0 0 100px rgba(0, 0, 0, 0.6),
        0 0 50px  rgba(180, 40, 80, 0.08),
        inset 0 1px 0 rgba(212, 175, 55, 0.14),
        inset 0 0 60px rgba(180, 40, 80, 0.04);
      max-width: min(90vw, 660px);
    }

    /* ── Trang trí ── */
    .ornament {
      font-size: clamp(0.85rem, 2.2vw, 1.15rem);
      letter-spacing: 10px;
      color: #D4AF37;
      opacity: 0;
      animation: fadeIn 1s ease 0.3s forwards;
    }

    /* ── Tiêu đề ── */
    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.65rem, 4.8vw, 3.5rem);
      font-weight: 400;
      font-style: italic;
      color: #FFF5EE;
      text-shadow:
        0 0  22px rgba(212, 175, 55, 0.42),
        0 0  46px rgba(214,  59,110, 0.22),
        0 2px 10px rgba(0, 0, 0, 0.80);
      line-height: 1.42;
      margin-top: 14px;
      opacity: 0;
      animation: titleReveal 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    @keyframes titleReveal {
      from { opacity: 0; transform: translateY(-10px); filter: blur(5px); }
      to   { opacity: 1; transform: translateY(0);     filter: blur(0);   }
    }

    /* ── Đường kẻ vàng ── */
    .divider {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(212, 175, 55, 0.85),
        transparent);
      margin: 18px 0 12px;
      opacity: 0;
      animation: dividerGrow 1.2s ease 1.15s forwards;
    }

    @keyframes dividerGrow {
      from { width: 0;     opacity: 0; }
      to   { width: 200px; opacity: 1; }
    }

    /* ── Ngày 20/10 ── */
    .date {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: clamp(4.5rem, 17vw, 9.5rem);
      font-weight: 800;
      line-height: 0.95;
      background: linear-gradient(135deg,
        #F5E070 0%,
        #D4AF37 28%,
        #C29820 52%,
        #EDD060 76%,
        #D4AF37 100%);
      background-size: 260% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation:
        dateFadeIn  1s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s forwards,
        goldShimmer 3.5s linear 1.2s infinite;
      filter: drop-shadow(0 0 28px rgba(212, 175, 55, 0.48));
      margin-bottom: 0.12em;
    }

    @keyframes dateFadeIn {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1);    }
    }

    @keyframes goldShimmer {
      from { background-position: 0%   center; }
      to   { background-position: 260% center; }
    }

    /* ── Lời chúc ── */
    .subtitle {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: clamp(0.87rem, 2.4vw, 1.22rem);
      font-weight: 300;
      color: rgba(248, 215, 225, 0.85);
      line-height: 1.9;
      letter-spacing: 0.35px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
      opacity: 0;
      animation: fadeSlideUp 1s ease 1.9s forwards;
    }

    .ornament-bottom {
      margin-top: 18px;
      font-size: clamp(0.95rem, 2.5vw, 1.35rem);
      letter-spacing: 8px;
      color: rgba(212, 175, 55, 0.80);
      opacity: 0;
      animation: fadeSlideUp 1s ease 2.3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="bloom"></div>
  <canvas id="c"></canvas>

  <div class="content">
    <div class="card">
      <div class="ornament">✦ ✦ ✦</div>
      <h1 class="title">Chúc Mừng Ngày<br>Phụ Nữ Việt Nam</h1>
      <div class="divider"></div>
      <div class="date" aria-label="20 tháng 10">20/10</div>
      <p class="subtitle">
        Chúc các chị em luôn rạng rỡ,<br>
        hạnh phúc và thành công
      </p>
      <div class="ornament-bottom">🌸 ✦ 🌸</div>
    </div>
  </div>

  <script>
    'use strict';

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    /* ─────────── BOKEH ORBS (ánh sáng tiệc) ─────────── */
    const BOKEH_PALETTE = [
      [248, 180, 208],  // hồng mềm
      [244, 160, 192],  // hồng đậm
      [255, 220, 200],  // đào ấm
      [255, 245, 230],  // kem vàng
      [212, 175,  55],  // vàng gold
      [255, 215, 140],  // vàng nhạt
      [252, 228, 236],  // blush
    ];

    class Bokeh {
      constructor(spread) { this.reset(spread ?? true); }
      reset(spread) {
        this.x      = Math.random() * canvas.width;
        this.y      = spread ? Math.random() * canvas.height : canvas.height + 70;
        this.r      = 20 + Math.random() * 50;
        const c     = BOKEH_PALETTE[Math.random() * BOKEH_PALETTE.length | 0];
        this.rc = c[0]; this.gc = c[1]; this.bc = c[2];
        this.alpha  = 0.06 + Math.random() * 0.13;
        this.vy     = -(0.22 + Math.random() * 0.60);
        this.vx     = (Math.random() - 0.5) * 0.32;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobR   = 0.007 + Math.random() * 0.013;
        this.pulse  = Math.random() * Math.PI * 2;
        this.pulseR = 0.010 + Math.random() * 0.016;
      }
      tick() {
        this.y      += this.vy;
        this.wobble += this.wobR;
        this.x      += this.vx + Math.sin(this.wobble) * 0.5;
        this.pulse  += this.pulseR;
        if (this.y + this.r < 0) this.reset(false);
      }
      draw() {
        const r  = this.r * (1 + Math.sin(this.pulse) * 0.07);
        const al = this.alpha;
        const g  = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
        g.addColorStop(0,   `rgba(${this.rc},${this.gc},${this.bc},${al})`);
        g.addColorStop(0.5, `rgba(${this.rc},${this.gc},${this.bc},${al * 0.45})`);
        g.addColorStop(1,   `rgba(${this.rc},${this.gc},${this.bc},0)`);
        ctx.save();
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const bokeh = Array.from({ length: 40 }, () => new Bokeh(true));

    /* ─────────── HOA CÚC BAY LÊN ─────────── */
    class Flower {
      constructor(spread) { this.reset(spread ?? true); }
      reset(spread) {
        this.x      = Math.random() * canvas.width;
        this.y      = spread ? Math.random() * canvas.height : canvas.height + 50;
        this.r      = 9 + Math.random() * 11;
        this.rot    = Math.random() * Math.PI * 2;
        this.rotV   = (Math.random() - 0.5) * 0.009;
        const v     = Math.random();
        if (v < 0.35) {
          this.c1 = '#FFFFFF';  this.c2 = '#F5E8EE';  // trắng ngà
        } else if (v < 0.65) {
          this.c1 = '#FFB6C8';  this.c2 = '#FFCCD8';  // hồng nhạt
        } else {
          this.c1 = '#FFD4A8';  this.c2 = '#FFE4C4';  // đào ấm
        }
        this.vy     = -(0.36 + Math.random() * 0.72);
        this.vx     = (Math.random() - 0.5) * 0.4;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobR   = 0.009 + Math.random() * 0.015;
        this.alpha  = 0.62 + Math.random() * 0.34;
      }
      tick() {
        this.y      += this.vy;
        this.wobble += this.wobR;
        this.x      += this.vx + Math.sin(this.wobble) * 0.5;
        this.rot    += this.rotV;
        if (this.y + this.r * 4 < 0) this.reset(false);
      }
      draw() {
        const r = this.r;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.globalAlpha = this.alpha;

        // 14 cánh mảnh xen kẽ 2 màu
        for (let i = 0; i < 14; i++) {
          ctx.save();
          ctx.rotate(i * Math.PI / 7);
          ctx.fillStyle = i % 2 === 0 ? this.c1 : this.c2;
          ctx.beginPath();
          ctx.ellipse(0, -r * 0.62, r * 0.16, r * 0.50, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Nhụy vàng
        ctx.fillStyle = '#C9A227';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFE060';
        ctx.beginPath();
        ctx.arc(-r * 0.07, -r * 0.08, r * 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    const flowers = Array.from({ length: 35 }, () => new Flower(true));

    /* ─────────── BỤI VÀNG (ambient sparkle) ─────────── */
    const GOLD_COLORS = ['#D4AF37', '#D4AF37', '#F0D060', '#FFF5E0'];

    class GoldDust {
      constructor() { this.reset(true); }
      reset(spread) {
        this.x     = Math.random() * canvas.width;
        this.y     = spread ? Math.random() * canvas.height
                            : (Math.random() < 0.5 ? -8 : canvas.height + 8);
        this.r     = 0.7 + Math.random() * 1.9;
        this.base  = 0.15 + Math.random() * 0.4;
        this.alpha = this.base;
        this.aDir  = (Math.random() > 0.5 ? 1 : -1) * (0.005 + Math.random() * 0.009);
        this.vy    = -(0.07 + Math.random() * 0.22);
        this.vx    = (Math.random() - 0.5) * 0.14;
        this.color = GOLD_COLORS[Math.random() * GOLD_COLORS.length | 0];
      }
      tick() {
        this.y     += this.vy;
        this.x     += this.vx;
        this.alpha += this.aDir;
        if (this.alpha > this.base + 0.28 || this.alpha < 0.04) this.aDir *= -1;
        if (this.y < -10 || this.y > canvas.height + 10) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle   = this.color;
        ctx.shadowColor = '#D4AF37';
        ctx.shadowBlur  = 5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const goldDust = Array.from({ length: 90 }, () => new GoldDust());

    /* ─────────── PHÁO HOADgold (tinh tế) ─────────── */
    const FW_COLORS = [
      '#D4AF37', '#F0C040', '#C9A227', '#F5D060',
      '#FFFFFF', '#FFF9E8', '#F8B4D0', '#FFCDD2',
      '#E8C97A', '#FFD4A0',
    ];

    class Spark {
      constructor(x, y, cA, cB) {
        this.x     = x; this.y = y;
        const a    = Math.random() * Math.PI * 2;
        const spd  = 0.9 + Math.random() * 4.2;
        this.vx    = Math.cos(a) * spd;
        this.vy    = Math.sin(a) * spd;
        this.color = Math.random() < 0.35 ? cB : cA;
        this.alpha = 1;
        this.r     = 1.4 + Math.random() * 2.4;
        this.tail  = [];
      }
      tick() {
        this.tail.push({ x: this.x, y: this.y });
        if (this.tail.length > 5) this.tail.shift();
        this.x    += this.vx;
        this.y    += this.vy;
        this.vy   += 0.07;
        this.vx   *= 0.977;
        this.vy   *= 0.977;
        this.alpha -= 0.018;
      }
      draw() {
        if (this.alpha <= 0) return;
        for (let i = 0; i < this.tail.length; i++) {
          const a = (i / this.tail.length) * this.alpha * 0.35;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.fillStyle   = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur  = 3;
          ctx.beginPath();
          ctx.arc(this.tail[i].x, this.tail[i].y, this.r * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle   = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur  = 7;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      dead() { return this.alpha <= 0; }
    }

    class Rocket {
      constructor() {
        this.x       = canvas.width  * (0.08 + Math.random() * 0.84);
        this.y       = canvas.height + 10;
        this.targetY = canvas.height * (0.10 + Math.random() * 0.48);
        this.vy      = -(7 + Math.random() * 5.5);
        this.colorA  = FW_COLORS[Math.random() * FW_COLORS.length | 0];
        this.colorB  = FW_COLORS[Math.random() * FW_COLORS.length | 0];
        this.trail   = [];
        this.done    = false;
      }
      tick(sparks) {
        if (this.done) return true;
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 8) this.trail.shift();
        this.y  += this.vy;
        this.vy += 0.18;
        if (this.y <= this.targetY || this.vy >= 0) {
          this.done = true;
          const n = 55 + (Math.random() * 40 | 0);
          for (let i = 0; i < n; i++) sparks.push(new Spark(this.x, this.y, this.colorA, this.colorB));
          return true;
        }
        return false;
      }
      draw() {
        for (let i = 0; i < this.trail.length; i++) {
          const a = (i / this.trail.length) * 0.5;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.fillStyle   = this.colorA;
          ctx.shadowColor = this.colorA;
          ctx.shadowBlur  = 6;
          ctx.beginPath();
          ctx.arc(this.trail[i].x, this.trail[i].y, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.fillStyle   = '#fff';
        ctx.shadowColor = this.colorA;
        ctx.shadowBlur  = 12;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let rockets = [];
    let sparks  = [];

    (function scheduleNext() {
      const delay = 2500 + Math.random() * 2800;
      setTimeout(() => {
        rockets.push(new Rocket());
        scheduleNext();
      }, delay);
    })();

    setTimeout(() => rockets.push(new Rocket()), 2800);

    /* ─────────── RENDER LOOP ─────────── */
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      goldDust.forEach(g => { g.tick(); g.draw(); });
      bokeh.forEach(b => { b.tick(); b.draw(); });
      flowers.forEach(f => { f.tick(); f.draw(); });

      rockets = rockets.filter(r => !r.tick(sparks));
      rockets.forEach(r => r.draw());
      sparks = sparks.filter(s => !s.dead());
      sparks.forEach(s => { s.tick(); s.draw(); });

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
